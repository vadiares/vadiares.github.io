<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Bài 2.5 - Màu nền theo ngữ cảnh</title>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>

        <div class="container mt-4">
            <h1>Màu nền theo ngữ cảnh</h1>
            <p>Sử dụng các class màu nền theo ngữ cảnh.</p>

            <div class="bg-primary text-white p-2 mb-2">
                Văn bản quan trọng.
            </div>

            <div class="bg-success text-white p-2 mb-2">
                Văn bản chỉ ra sự thành công.
            </div>

            <div class="bg-info text-dark p-2 mb-2">
                Văn bản chứa thông tin.
            </div>

            <div class="bg-warning text-dark p-2 mb-2">
                Văn bản này là cảnh báo.
            </div>

            <div class="bg-danger text-white p-2 mb-2">
                Văn bản thông báo sự nguy hiểm.
            </div>

            <div class="bg-secondary text-white p-2 mb-2">
                Màu nền phụ.
            </div>

            <div class="bg-dark text-white p-2 mb-2">
                Màu nền xám đen.
            </div>

            <div class="bg-light text-dark p-2 mb-2">
                Màu nền xám trắng.
            </div>
        </div>

        <!-- Bootstrap JavaScript Bundle -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
