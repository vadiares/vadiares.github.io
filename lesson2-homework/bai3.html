<!doctype html>
<html lang="en" data-bs-theme="light">

<head>
    <title>Bài 2.3 - Căn chỉnh hình ảnh</title>

    <!-- Required meta tags -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap CSS v5.3.8 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous" />
</head>

<body>

    <main class="container mt-4">
        <h2>Bài 2.3: Căn chỉnh hình ảnh</h2>
        <!-- Căn trái -->
        <p>Left alignment (This is default)</p>
        <div class="border border-dark p-2 mb-3">
            <img src="img/anh1.jpg" width="50" height="50">
        </div>
        <!-- Căn giữa bằng text alignment -->
        <p>Center alignment using text alignment classes</p>
        <div class="border border-dark p-2 mb-3 text-center">
            <img src="img/anh1.jpg" width="50" height="50">
        </div>
        <!-- Căn phải bằng text alignment -->
        <p>Right alignment using text alignment classes</p>
        <div class="border border-dark p-2 mb-3 text-end">
            <img src="img/anh1.jpg" width="50" height="50">
        </div>
        <!-- Căn ngang bằng float -->
        <p>Horizontal alignment using float classes</p>

        <div class="border border-dark p-2 mb-3 clearfix">
            <img src="img/anh1.jpg" width="50" height="50" class="float-start">
            <img src="img/anh1.jpg" width="50" height="50" class="float-end">
        </div>
        <!-- Căn giữa bằng margin auto -->
        <p>Center alignment of block-level image using auto margin</p>
        <div class="border border-dark p-2 mb-3">
            <img src="img/anh1.jpg" width="50" height="50" class="d-block mx-auto">
        </div>
    </main>
    <!-- Bootstrap JavaScript Bundle -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrVcwKX/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous">
    </script>

</body>

</html>
