<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Bài 3.1 - Buttons</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
 
        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>
 
    <body>
        <header>
            <!-- place navbar here -->
        </header>
        <main class="container my-4">
 
            <h2 class="mb-4">Bài 3.1: Tạo các Buttons theo mẫu</h2>
            <section class="mb-5">
                <h4>a. Định nghĩa các class buttons</h4>
                <button type="button" class="btn btn-light me-2 mb-2">Default Button</button>
                <button type="button" class="btn btn-primary me-2 mb-2">Primary Button</button>
                <button type="button" class="btn btn-success me-2 mb-2">Success Button</button>
                <button type="button" class="btn btn-info me-2 mb-2">Info Button</button>
                <button type="button" class="btn btn-warning me-2 mb-2">Warning Button</button>
                <button type="button" class="btn btn-danger me-2 mb-2">Danger Button</button>
                <a href="#" class="btn btn-link me-2 mb-2">Link Button</a>
            </section>
            
            <section class="mb-5">
                <h4>b. Button với đường viền</h4>
                <button type="button" class="btn btn-outline-primary me-2 mb-2">Primary</button>
                <button type="button" class="btn btn-outline-secondary me-2 mb-2">Secondary</button>
                <button type="button" class="btn btn-outline-success me-2 mb-2">Success</button>
                <button type="button" class="btn btn-outline-info me-2 mb-2">Info</button>
                <button type="button" class="btn btn-outline-warning me-2 mb-2">Warning</button>
                <button type="button" class="btn btn-outline-danger me-2 mb-2">Danger</button>
                <button type="button" class="btn btn-outline-dark me-2 mb-2">Dark</button>
                <a href="#" class="btn btn-link me-2 mb-2">Light</a>
            </section>
            
            <section class="mb-5">
                <h4>c. Kích thước của button</h4>
                <button type="button" class="btn btn-dark btn-lg me-2 mb-2">Nút to</button>
                <button type="button" class="btn btn-dark me-2 mb-2">Kích thước mặc định</button>
                <button type="button" class="btn btn-dark btn-sm me-2 mb-2">Nút nhỏ</button>
            </section>
            
            <section class="mb-5">
                <h4>d. Thành phần của Button</h4>
                <a class="btn btn-secondary me-2 mb-2" href="#" role="button">Button chứa link</a>
                <button type="button" class="btn btn-secondary me-2 mb-2">Button</button>
                <input type="button" class="btn btn-secondary me-2 mb-2" value="Input Button">
                <input type="submit" class="btn btn-secondary me-2 mb-2" value="Submit Button">
            </section>
 
            <section class="mb-5">
                <h4>e. Trạng thái của nút</h4>
                <button type="button" class="btn btn-dark me-2 mb-2">Nút bình thường</button>
                <button type="button" class="btn btn-dark me-2 mb-2">Nút có thể click</button>
                <button type="button" class="btn btn-dark me-2 mb-2" disabled>Nút không thể click</button>
                <a class="btn btn-dark disabled me-2 mb-2" role="button" aria-disabled="true">Link không thể click</a>
            </section>
            
            <section class="mb-5">
                <h4>f. Nút đang load</h4>
                <button class="btn btn-dark me-2 mb-2" type="button" disabled>
                    <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
                </button>
                <button class="btn btn-dark me-2 mb-2" type="button" disabled>
                    <span class="spinner-border spinner-border-sm" aria-hidden="true"></span>
                    Loading..
                </button>
                <button class="btn btn-dark me-2 mb-2" type="button" disabled>
                    <span class="spinner-grow spinner-grow-sm" aria-hidden="true"></span>
                    Loading..
                </button>
                <button class="btn btn-dark me-2 mb-2" type="button" disabled>
                    Loading..
                </button>
            </section>
 
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
