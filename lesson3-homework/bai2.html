<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Bài 3.2 - Button Group</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
 
        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
        <!-- Bootstrap Icons (dùng cho icon View/Edit/Delete và toolbar) -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
            rel="stylesheet"
        />
    </head>
 
    <body>
        <header>
            <!-- place navbar here -->
        </header>
        <main class="container my-4">
            <h2 class="mb-4">Bài 3.2: Tạo button group theo mẫu</h2>
            <section class="mb-5">
                <h4>a.</h4>
                <div class="btn-group" role="group" aria-label="Menu chính">
                    <button type="button" class="btn btn-dark">Home</button>
                    <button type="button" class="btn btn-dark">About</button>
                    <button type="button" class="btn btn-dark">Services</button>
                </div>
            </section>
            <section class="mb-5">
                <h4>b.</h4>
                <div class="btn-group" role="group" aria-label="Thao tác">
                    <button type="button" class="btn btn-secondary">
                        <i class="bi bi-eye"></i> View
                    </button>
                    <button type="button" class="btn btn-light">
                        <i class="bi bi-pencil"></i> Edit
                    </button>
                    <button type="button" class="btn btn-secondary">
                        <i class="bi bi-trash"></i> Delete
                    </button>
                </div>
            </section>
            <section class="mb-5">
                <h4>c.</h4>
                <div class="btn-toolbar" role="toolbar" aria-label="Thanh công cụ soạn thảo">
                    <div class="btn-group me-2" role="group" aria-label="Định dạng chữ">
                        <button type="button" class="btn btn-dark fw-bold" aria-label="Định dạng chữ">T</button>
                        <button type="button" class="btn btn-dark"><i class="bi bi-type-bold"></i></button>
                        <button type="button" class="btn btn-dark"><i class="bi bi-type-italic"></i></button>
                        <button type="button" class="btn btn-dark"><i class="bi bi-type-underline"></i></button>
                    </div>
                    <div class="btn-group me-2" role="group" aria-label="Căn lề">
                        <button type="button" class="btn btn-dark"><i class="bi bi-text-left"></i></button>
                        <button type="button" class="btn btn-dark"><i class="bi bi-text-center"></i></button>
                        <button type="button" class="btn btn-dark"><i class="bi bi-text-right"></i></button>
                        <button type="button" class="btn btn-dark"><i class="bi bi-justify"></i></button>
                    </div>
                    <div class="btn-group" role="group" aria-label="Code">
                        <button type="button" class="btn btn-dark"><i class="bi bi-code-slash"></i></button>
                    </div>
                </div>
            </section>
 
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
