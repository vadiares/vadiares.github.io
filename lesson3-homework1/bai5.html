<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Bài 3.5 - Form và xử lý nhập liệu</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
 
        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>
 
    <body>
        <header>
            <!-- place navbar here -->
        </header>
        <main class="container my-4">
            <h2 class="mb-4">Bài 3.5: Tạo form và xử lý nhập liệu cho form</h2>
            <section class="mb-5">
                <h4>a. Xác thực biểu mẫu</h4>
                <p class="text-muted">Ví dụ bạn gửi biểu mẫu nhưng chưa điền hết thông tin thì sẽ nhận được thông báo như bên dưới.</p>
 
                <form class="was-validated" style="max-width: 500px;" novalidate>
                    <div class="mb-3">
                        <label for="username" class="form-label">Tên người dùng:</label>
                        <input type="text" class="form-control" id="username" placeholder="Nhập tên người dùng" required>
                        <div class="invalid-feedback">Điền đầy đủ thông tin.</div>
                    </div>
                    <div class="mb-3">
                        <label for="pwd" class="form-label">Mật khẩu:</label>
                        <input type="password" class="form-control" id="pwd" placeholder="Enter password" required>
                        <div class="invalid-feedback">Điền đầy đủ thông tin.</div>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="agree" required>
                        <label class="form-check-label" for="agree">Đồng ý</label>
                        <div class="invalid-feedback">Bạn cần đồng ý trước khi tiếp tục.</div>
                    </div>
                    <button type="submit" class="btn btn-dark">Đăng nhập</button>
                </form>
            </section>

            <section class="mb-5">
                <h4>b. Registration Form</h4>
                <h3>Registration Form</h3>
                <form style="max-width: 600px;">
                    <div class="row mb-3">
                        <label for="firstName" class="col-sm-4 col-form-label">First Name:</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" id="firstName" placeholder="First Name">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <label for="lastName" class="col-sm-4 col-form-label">Last Name:</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" id="lastName" placeholder="Last Name">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <label for="regEmail" class="col-sm-4 col-form-label">Email Address:</label>
                        <div class="col-sm-8">
                            <input type="email" class="form-control" id="regEmail" placeholder="Email Address">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <label for="mobile" class="col-sm-4 col-form-label">Mobile Number:</label>
                        <div class="col-sm-8">
                            <input type="tel" class="form-control" id="mobile" placeholder="Phone Number">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <label class="col-sm-4 col-form-label">Date of Birth:</label>
                        <div class="col-sm-8">
                            <div class="row g-2">
                                <div class="col">
                                    <select class="form-select" aria-label="Date">
                                        <option selected>Date</option>
                                        <option value="1">1</option>
                                        <option value="2">2</option>
                                        <option value="3">3</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <select class="form-select" aria-label="Month">
                                        <option selected>Month</option>
                                        <option value="1">January</option>
                                        <option value="2">February</option>
                                        <option value="3">March</option>
                                    </select>
                                </div>
                                <div class="col">
                                    <select class="form-select" aria-label="Year">
                                        <option selected>Year</option>
                                        <option value="2024">2024</option>
                                        <option value="2023">2023</option>
                                        <option value="2022">2022</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <label for="postalAddress" class="col-sm-4 col-form-label">Postal Address:</label>
                        <div class="col-sm-8">
                            <textarea class="form-control" id="postalAddress" rows="3" placeholder="Postal Address"></textarea>
                        </div>
                    </div>
                    <div class="row mb-3">
                        <label for="zipCode" class="col-sm-4 col-form-label">Zip Code:</label>
                        <div class="col-sm-8">
                            <input type="text" class="form-control" id="zipCode" placeholder="Zip Code">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <label for="uploadImage" class="col-sm-4 col-form-label">Upload Image:</label>
                        <div class="col-sm-8">
                            <input class="form-control" type="file" id="uploadImage">
                        </div>
                    </div>
                    <div class="row mb-3">
                        <label class="col-sm-4 col-form-label">Gender:</label>
                        <div class="col-sm-8">
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="genderMale">
                                <label class="form-check-label" for="genderMale">Male</label>
                            </div>
                            <div class="form-check form-check-inline">
                                <input class="form-check-input" type="radio" name="gender" id="genderFemale">
                                <label class="form-check-label" for="genderFemale">Female</label>
                            </div>
                        </div>
                    </div>
                    <div class="mb-3 form-check">
                        <input type="checkbox" class="form-check-input" id="terms">
                        <label class="form-check-label" for="terms">I agree to the <a href="#">Terms and Conditions</a></label>
                    </div>
                    <button type="submit" class="btn btn-dark me-2">Submit</button>
                    <button type="reset" class="btn btn-secondary">Reset</button>
                </form>
            </section>
 
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
