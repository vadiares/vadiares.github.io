<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Bài 3.4 - Form đăng nhập</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
 
        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>
 
    <body>
        <header>
            <!-- place navbar here -->
        </header>
        <main class="container my-4">
 
            <h2 class="mb-4">Bài 3.4: Tạo form đăng nhập theo mẫu</h2>
 
            <h4>a. Form đăng nhập</h4>
            <form style="max-width: 500px;">
                <div class="mb-3 row">
                    <label for="loginEmail" class="col-sm-2 col-form-label">Email</label>
                    <div class="col-sm-10">
                        <input type="email" class="form-control" id="loginEmail" placeholder="Email">
                    </div>
                </div>
                <div class="mb-3 row">
                    <label for="loginPassword" class="col-sm-2 col-form-label">Mật khẩu</label>
                    <div class="col-sm-10">
                        <input type="password" class="form-control" id="loginPassword" placeholder="Mật khẩu">
                    </div>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">Remember me</label>
                </div>
                <button type="submit" class="btn btn-dark">Đăng nhập</button>
            </form>
 
            <h4 class="mt-5">b. Textarea</h4>
            <form style="max-width: 500px;">
                <div class="mb-3">
                    <label for="comment" class="form-label">Bình luận:</label>
                    <textarea class="form-control" id="comment" rows="4"></textarea>
                </div>
                <button type="submit" class="btn btn-dark">Gửi</button>
            </form>
 
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
