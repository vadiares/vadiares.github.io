<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
        />
    </head>

    <body>
        <header>
            
        </header>
        <main>
            <div class="container mt-3">
                <h2>Đăng Nhập Tài Khoản</h2>
            <div class="mb-3">
                <label for="" class="form-label">Email:</label>
                <input
                        type="text"
                        class="form-control"
                    name=""
                    id="1"
                    aria-describedby="helpId"
                    placeholder="example: email@gmail.com"
                />
                <small id="helpId" class="form-text text-body-secondary"
                    >Email phải bao gồm @ và đuôi .com</small
                >
            </div>
            <div class="mb-3">
                <label for="" class="form-label">Mật Khẩu:</label>
                <input
                    type="password"
                    class="form-control"
                    name=""
                    id="2"
                    placeholder="example: Password@123"
                />
                <small id="helpId" class="form-text text-body-secondary"
                    >Yếu cầu: ít nhất 8 ký tự, bao gồm chữ hoa, chữ thường, số và ký tự đặc biệt</small
                >
            </div>
            <div class="form-check">
                <input class="form-check-input" type="checkbox" value="" id="2" />
                <label class="form-check-label" for="2"> Lưu Mật Khẩu </label>
            </div>           
            <button
                type="submit"
                class="btn btn-success mt-3"
            >
                Đăng Nhập
            </button>
        </div>
        </main>
        <footer>
            <!-- place footer here -->
        </footer>
        <!-- Bootstrap JavaScript Bundle (includes Popper) -->
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"
        ></script>
    </body>
</html>
